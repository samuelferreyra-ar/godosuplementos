<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar — GODO Suplementos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/godo.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/acceso.css">
</head>
<body data-pantalla="login">

<header class="a-cabecera">
  <img src="assets/Logo-Godo.webp" alt="GODO Suplementos">
  <h1>Ingresar</h1>
  <p>Entrá para ver tus pedidos y tus direcciones guardadas.</p>
</header>

<main class="a-cuerpo">
  <div id="aviso" hidden></div>
  <form id="form" novalidate>
    <div class="a-campos">
      <div class="a-campo">
        <label for="email">Mail</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
      </div>
      <div class="a-campo a-clave">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
        <button type="button" class="a-ojo" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <a class="a-olvide" href="recuperar.html">Olvidé mi contraseña</a>

    <div class="a-acciones">
      <button class="g-btn g-btn-primario" id="enviar" type="submit">Ingresar</button>
    </div>
  </form>

  <div class="a-separador">O</div>
  <a class="g-btn g-btn-borde" href="registro.html">Crear una cuenta</a>

  <div class="a-info" style="margin-top:20px">
    <b>No hace falta cuenta para comprar</b>
    <p>No necesitás una cuenta para comprar: armá tu carrito y coordiná el pedido por WhatsApp.</p>
  </div>
</main>

<script type="module" src="js/acceso.js"></script>
</body>
</html>
