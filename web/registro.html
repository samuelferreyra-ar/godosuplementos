<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear cuenta — GODO Suplementos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/godo.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/acceso.css">
</head>
<body data-pantalla="registro">

<header class="a-cabecera">
  <img src="assets/Logo-Godo.webp" alt="GODO Suplementos">
  <h1>Crear una cuenta</h1>
  <p>Para seguir tus pedidos y no volver a cargar tus datos.</p>
</header>

<main class="a-cuerpo">
  <div id="aviso" hidden></div>
  <form id="form" novalidate>
    <div class="a-campos">
      <div class="a-campo">
        <label for="nombre">Nombre y apellido</label>
        <input id="nombre" type="text" autocomplete="name" required>
      </div>
      <div class="a-campo">
        <label for="email">Mail</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
      </div>
      <div class="a-campo">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" autocomplete="tel" inputmode="tel" required>
      </div>
      <div class="a-campo a-clave">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="new-password" minlength="6" required>
        <button type="button" class="a-ojo" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
      </div>
    </div>

    <div class="a-acciones">
      <button class="g-btn g-btn-primario" id="enviar" type="submit">Crear cuenta</button>
    </div>
  </form>

  <div class="a-separador">O</div>
  <a class="g-btn g-btn-borde" href="login.html">Ya tengo cuenta</a>
</main>

<script type="module" src="js/acceso.js"></script>
</body>
</html>
